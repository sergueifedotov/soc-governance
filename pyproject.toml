[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-governance"
version = "0.1.0"
description = "Marifort SOC governance — MCP tool policy, human-gated SIEM response, forensics (fork of Wazuh MCP Server v4.2.1 plus original layers)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Serguei Fedotov"}
]
keywords = ["wazuh", "security", "mcp", "sse", "siem", "remote-server"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    # Core Framework
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    # HTTP & Data
    "httpx>=0.28.1",
    "requests>=2.32.0",
    "pydantic>=2.12.0",
    # Security & Auth
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.9",
    # Monitoring
    "prometheus-client>=0.24.0",
    "psutil>=6.0.0",
    # Resilience
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "aiofiles>=24.0.0",
    # MCP Framework
    "fastmcp>=2.14.0",
    # Phase 2 orchestration
    "packaging>=24.0",
    "langchain>=0.3.25",
    "langchain-openai>=0.3.14",
    "langfuse>=2.56.0,<3.0.0",
]

[project.optional-dependencies]
redis = [
    "redis>=7.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/sergueifedotov/soc-governance"
Repository = "https://github.com/sergueifedotov/soc-governance"
"Bug Tracker" = "https://github.com/sergueifedotov/soc-governance/issues"
Upstream = "https://github.com/gensecaihq/Wazuh-MCP-Server"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["wazuh_mcp_server*"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"