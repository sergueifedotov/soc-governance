# Phase 3 LangGraph companion service overlay
# Usage:
#   docker compose -f compose.full.yml -f compose.phase3.langgraph.yml up -d --build phase3-langgraph

services:
  phase3-langgraph:
    build:
      context: ./services/phase3_langgraph
      dockerfile: Dockerfile
    image: wazuh-phase3-langgraph:0.1.0
    container_name: phase3-langgraph
    hostname: phase3-langgraph
    restart: unless-stopped
    environment:
      MCP_BASE_URL: ${PHASE3_MCP_BASE_URL:-http://wazuh-mcp-server:3000}
      MCP_API_KEY: ${MCP_API_KEY:-wazuh_local_demo_change_me}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_TRACE_NAME: ${LANGFUSE_TRACE_NAME:-phase3_workflow}
      # Phase 4 integration: persist HITL approvals to Phase 4 DB
      PHASE4_API_URL: ${PHASE4_API_URL:-http://phase4-api:8082}
    ports:
      - "${PHASE3_LANGGRAPH_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8081/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - phase4
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

networks:
  phase4:
    # When used with compose.phase4.yml this network is created there.
    # When used standalone it is created automatically.
    driver: bridge
