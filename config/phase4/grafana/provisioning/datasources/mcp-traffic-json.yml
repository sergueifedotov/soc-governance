apiVersion: 1

# Infinity datasource for the live MCP traffic feed.
# Polls /observability/recent on the wazuh-mcp-server in the same docker
# network. Bearer auth via the MCP_API_KEY env var passed in compose.phase4.yml.
datasources:
  - name: MCP Traffic JSON
    type: yesoreyeram-infinity-datasource
    access: proxy
    uid: mcp-traffic-json
    url: http://wazuh-mcp-server:3000
    editable: false
    jsonData:
      auth_method: bearerToken
      allowed_hosts:
        - http://wazuh-mcp-server:3000
    secureJsonData:
      bearerToken: ${MCP_API_KEY}
